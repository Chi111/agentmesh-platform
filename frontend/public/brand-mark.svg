<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">pinme-mesh brand mark</title>
  <desc id="desc">A mesh cell containing a continuous M-shaped route that converges into a location anchor.</desc>
  <defs>
    <linearGradient id="surface" x1="9" y1="6" x2="55" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#122832"/>
      <stop offset="0.5" stop-color="#0A171E"/>
      <stop offset="1" stop-color="#050C11"/>
    </linearGradient>
    <linearGradient id="frame" x1="14" y1="13" x2="48" y2="53" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8FF4FB"/>
      <stop offset="0.52" stop-color="#32D4E7"/>
      <stop offset="1" stop-color="#B7F34A"/>
    </linearGradient>
    <linearGradient id="route" x1="18" y1="23" x2="44" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E9FFFF"/>
      <stop offset="0.44" stop-color="#8FF4FB"/>
      <stop offset="1" stop-color="#B7F34A"/>
    </linearGradient>
    <radialGradient id="field" cx="0" cy="0" r="1" gradientTransform="translate(32 32) rotate(90) scale(25)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#32D4E7" stop-opacity="0.17"/>
      <stop offset="0.7" stop-color="#32D4E7" stop-opacity="0.025"/>
      <stop offset="1" stop-color="#32D4E7" stop-opacity="0"/>
    </radialGradient>
    <filter id="signal" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.25" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="17" fill="url(#surface)"/>
  <rect x="1" y="1" width="62" height="62" rx="16" fill="none" stroke="#DFFFFF" stroke-opacity="0.11"/>
  <circle cx="32" cy="31" r="25" fill="url(#field)"/>

  <path
    d="M32 7.5 50.5 18v20.8L32 55.5 13.5 41V18L32 7.5Z"
    fill="#061117"
    fill-opacity="0.5"
    stroke="url(#frame)"
    stroke-width="2.15"
    stroke-linejoin="round"
  />
  <path d="M18.5 21.2 32 13.6l13.5 7.6" fill="none" stroke="#E9FFFF" stroke-opacity="0.13" stroke-width="1" stroke-linecap="round"/>
  <path d="M18.5 41V24.5L32 36l13.5-11.5V41" fill="none" stroke="url(#route)" stroke-width="3.25" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M32 36v11.8" fill="none" stroke="url(#route)" stroke-width="2.4" stroke-linecap="round"/>

  <g filter="url(#signal)">
    <circle cx="18.5" cy="24.5" r="2.35" fill="#8FF4FB"/>
    <circle cx="32" cy="36" r="3" fill="#071219" stroke="#E9FFFF" stroke-width="1.4"/>
    <circle cx="32" cy="36" r="1.15" fill="#32D4E7"/>
    <circle cx="45.5" cy="24.5" r="2.35" fill="#B7F34A"/>
    <circle cx="32" cy="48" r="2.5" fill="#B7F34A"/>
  </g>

  <path d="M24 51.7 32 57l8-5.3" fill="none" stroke="#DFFFFF" stroke-opacity="0.12" stroke-width="1" stroke-linecap="round"/>
</svg>
